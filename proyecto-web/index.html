<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2><i class="fas fa-music"></i> MusicApp</h2>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="#" class="active"><i class="fas fa-home"></i> Inicio</a></li>
                    <li><a href="#"><i class="fas fa-search"></i> Buscar</a></li>
                    <li><a href="#"><i class="fas fa-book"></i> Tu Biblioteca</a></li>
                    <li><a href="#"><i class="fas fa-podcast"></i> Podcasts</a></li>
                </ul>
                <div class="separator"></div>
                <ul>
                    <li><a href="#"><i class="fas fa-plus-square"></i> Crear Playlist</a></li>
                    <li><a href="#"><i class="fas fa-heart"></i> Tus Me Gusta</a></li>
                </ul>
                <div class="separator"></div>
                <div class="playlists-list">
                    <p>Música para Programar</p>
                    <p>Éxitos de los 80s</p>
                    <p>LoFi Chill</p>
                    <p>Top Hits España</p>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i> Perfil
                </div>
            </header>
            
            <section class="content-section">
                <div class="section-header">
                    <h2>Escuchado recientemente</h2>
                    <div class="carousel-nav">
                        <button class="nav-btn prev"><i class="fas fa-chevron-left"></i></button>
                        <button class="nav-btn next"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="music-grid-container">
                    <div class="music-grid" id="recent-grid">
                        <!-- Cards will be populated by JS -->
                    </div>
                </div>
            </section>

            <section class="content-section">
                <div class="section-header">
                    <h2>Canciones Destacadas</h2>
                    <div class="carousel-nav">
                        <button class="nav-btn prev"><i class="fas fa-chevron-left"></i></button>
                        <button class="nav-btn next"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="music-grid-container">
                    <div class="music-grid" id="music-grid">
                        <!-- Cards will be populated by JS -->
                    </div>
                </div>
            </section>

            <section class="content-section">
                <div class="section-header">
                    <h2>Mixes para ti</h2>
                    <div class="carousel-nav">
                        <button class="nav-btn prev"><i class="fas fa-chevron-left"></i></button>
                        <button class="nav-btn next"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="music-grid-container">
                    <div class="music-grid" id="mixes-grid">
                        <!-- Cards will be populated by JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Player Bottom Bar -->
    <div class="player-bar">
        <div class="now-playing">
            <div class="track-info">
                <h4 id="current-title">Selecciona una canción</h4>
                <p id="current-artist">-</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prev-btn"><i class="fas fa-step-backward"></i></button>
                <button id="play-pause-btn" class="play-btn"><i class="fas fa-play"></i></button>
                <button id="next-btn"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <i class="fas fa-volume-up"></i>
            <div class="volume-bar">
                <div class="volume-progress"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
